[project]
name = "django-mailer"
description = "A reusable Django app for queuing the sending of email"
authors = [
    { name = "Pinax Team", email = "developers@pinaxproject.com" }
]
license = {text = "MIT"}
urls = {Homepage = "http://github.com/pinax/django-mailer/"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: Django",
]
requires-python = ">=3.10"
dependencies = [
    "Django >= 2.2",
    "filelock>=3.20.0",
]
dynamic = ["version"]

[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
mailer = ["locale/*/LC_MESSAGES/*.*"]


# MAYBE:
# [build-system]
# requires = ["uv_build>=0.9.6,<0.10.0"]
# build-backend = "uv_build"

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[tool.setuptools.dynamic]
version = {attr = "mailer.__version__"}


[tool.black]
line-length = 120
# required-version = '22.1.3' # see https://github.com/psf/black/issues/2493
target-version = ['py310']

[tool.isort]
line_length = 120
profile = "black"
multi_line_output = 3

[tool.ruff]
line-length = 120
target-version = 'py310'

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "FLY"]

[dependency-groups]
dev = [
    "check-manifest>=0.51",
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.11.1",
    "tox>=4.32.0",
    "tox-uv>=1.29.0",
]
