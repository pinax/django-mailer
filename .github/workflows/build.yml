name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sync with tox.ini
        include:
        - python-version: "3.10"
          django-version: 3.2.4
        - python-version: "3.10"
          django-version: 4.2.2
        - python-version: "3.11"
          django-version: 4.2.2
        - python-version: "3.11"
          django-version: 5.0.14
        - python-version: "3.12"
          django-version: 5.0.14
        - python-version: "3.12"
          django-version: 5.1.14
        - python-version: "3.12"
          django-version: 5.2.8
        - python-version: "3.13"
          django-version: "6.0"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }} with uv
      uses: drivendataorg/setup-python-uv-action@v1.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'packages'

    - name: Install dependencies
      run: |
        uv sync
        uv pip install Django==${{ matrix.django-version }}
    - name: Test with pytest
      run: |
        uv run pytest

    - name: check-manifest
      run: |
        uv run check-manifest

  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - uses: pre-commit/action@v3.0.1
